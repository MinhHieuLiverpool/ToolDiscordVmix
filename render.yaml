services:
  - type: web
    name: vmix-monitor-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port ${PORT}
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: vmix_monitor
      - key: COLLECTION_NAME
        value: logs
      - key: DISCORD_WEBHOOK
        sync: false
      - key: PREFIX
        value: SRT
